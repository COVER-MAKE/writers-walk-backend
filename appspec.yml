version: 0.0
os: linux

files:
  - source: app.jar
    destination: /home/ubuntu/
    overwrite: true
  - source: writerswalk.service
    destination: /etc/systemd/system/
    overwrite: true

hooks:
  ApplicationStop:
    - location: scripts/stop.sh
      timeout: 180
      runas: root

  ApplicationStart:
    - location: scripts/start.sh
      timeout: 300
      runas: root