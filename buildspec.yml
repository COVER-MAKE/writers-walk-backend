version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17
  build:
    commands:
      - chmod +x gradlew
      - ./gradlew clean build
  post_build:
    commands:
      - JAR_PATH=$(find build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*-plain.jar" | head -n 1)
      - test -n "$JAR_PATH"
      - cp "$JAR_PATH" app.jar

cache:
  paths:
    - '/root/.gradle/caches/**/*'
    - '/root/.gradle/wrapper/**/*'

artifacts:
  files:
    - app.jar
    - appspec.yml
    - scripts/**
    - writerswalk.service
